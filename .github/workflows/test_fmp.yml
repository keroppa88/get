name: Test FMP endpoints

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test_fmp.js
        env:
          FMP_API: ${{ secrets.FMP_API }}
        run: node test_fmp.js
