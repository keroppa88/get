name: Daily get Update

on:
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 19:00 JST (Mon–Fri)
    - cron: '0 10 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scripts (sequential, continue on error)
        run: |
          set +e

          echo "=== get_nikkei225.js ==="
          xvfb-run -a node get_nikkei225.js || echo "FAILED: get_nikkei225.js"

          echo "=== get_jpx.js ==="
          xvfb-run -a node get_jpx.js || echo "FAILED: get_jpx.js"

          echo "=== get_nikkeisemicon.js ==="
          xvfb-run -a node get_nikkeisemicon.js || echo "FAILED: get_nikkeisemicon.js"

          echo "=== get_nikkeivi.js ==="
          xvfb-run -a node get_nikkeivi.js || echo "FAILED: get_nikkeivi.js"

          echo "=== get_yen.js ==="
          xvfb-run -a node get_yen.js || echo "FAILED: get_yen.js"
          
          echo "=== get_bitcoin.js ==="
          xvfb-run -a node get_bitcoin.js || echo "FAILED: get_bitcoin.js"

          echo "=== get_yomiuri333.js ==="
          xvfb-run -a node get_yomiuri333.js || echo "FAILED: get_yomiuri333.js"

          echo "=== get_yahoofinance.js ==="
          xvfb-run -a node get_yahoofinance.js || echo "FAILED: get_yahoofinance.js"

          echo "=== get_nikkeisijo.js ==="
          xvfb-run -a node get_nikkeisijo.js || echo "FAILED: get_nikkeisijo.js"

          echo "=== get_nikkeimany.js ==="
          xvfb-run -a node get_nikkeimany.js || echo "FAILED: get_nikkeimany.js"

          echo "=== get_nikkeietc.js ==="
          xvfb-run -a node get_nikkeietc.js || echo "FAILED: get_nikkeietc.js"

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/*.csv
          git commit -m "Automated update" || exit 0
          git push
