name: Daily make Update
# get.ymlが動作し終わったら動作する設定。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily get Update"]    # ← .yml の name と一致させる
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
              
      - name: Run make scripts (continue on error)
        run: |
          set +e
        
          echo "=== make_jpx.js ==="
          node make_jpx.js || echo "FAILED: make_jpx.js"

          echo "=== make_nikkei225.js ==="
          node make_nikkei225.js || echo "FAILED: make_nikkei225.js"

          echo "=== make_nikkeivi.js ==="
          node make_nikkeivi.js || echo "FAILED: make_nikkeivi.js"

          echo "=== make_nikkeisemicon.js ==="
          node make_nikkeisemicon.js || echo "FAILED: make_nikkeisemicon.js"

          echo "=== make_yen.js ==="
          node make_yen.js || echo "FAILED: make_yen.js"


      - name: Debug outputs
        if: always()
        run: |
          pwd
          ls -la data
          ls -la data/pricedata || true
          git status --porcelain
        
      - name: Save results
        if: always()
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/pricedata
          git commit -m "Automated update: pricedata" || exit 0

          # 変更があるときだけ push
          if [ -n "$(git status --porcelain)" ]; then
            git push
          else
            echo "No changes to push"
          fi
