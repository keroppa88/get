name: Daily make Update

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run make_jpx.js
        run: node make_jpx.js
        
      - name: Run make_nikkei225.js
        run: node make_nikkei225.js

      - name: Run make_nikkeivi.js
        run: node make_nikkeivi.js

      - name: Debug outputs
        run: |
          pwd
          ls -la data
          ls -la data/pricedata || true
          git status --porcelain

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/pricedata
          git commit -m "Automated update: pricedata" || exit 0
          git push
