name: Daily get Update

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 07:30 JST (日本時間 朝7時30分)
    - cron: '30 22 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run nikkei2.js
        run: xvfb-run -a node get_nikkeivi.js

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/nikkeivi.csv
          git commit -m "Automated update: nikkeivi.csv" || exit 0
          git push
