name: Daily get_usa Update

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC (Mon–Fri) = 翌朝07:00 JST (火～土)
    - cron: '0 22 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scripts (sequential, continue on error)
        run: |
          set +e

          echo "=== get_usa.js ==="
          xvfb-run -a node get_usa.js || echo "FAILED: get_usa.js"

          echo "=== get_minkabucrypto.js ==="
          xvfb-run -a node get_minkabucrypto.js || echo "FAILED: get_minkabucrypto.js"

          echo "=== get_rakuten.js ==="
          xvfb-run -a node get_rakuten.js || echo "FAILED: get_rakuten.js"

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/*.csv
          git commit -m "Automated update" || exit 0
          git push
