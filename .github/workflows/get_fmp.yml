name: Daily get_fmp Update

on:
  workflow_dispatch:
  schedule:
    # 08:00 JST = 23:00 UTC (Mon–Fri) 米国市場終了後
    - cron: '0 23 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run get_fmp.js (API取得)
        env:
          fmp_api: ${{ secrets.fmp_api }}
        run: node get_fmp.js

      - name: Run make_fmp.js (CSV整形)
        run: node make_fmp.js

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/fmp.json data/pricedata/*.csv
          git commit -m "Automated update (FMP)" || exit 0
          git push
