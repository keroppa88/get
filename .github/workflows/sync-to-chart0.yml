name: Sync pricedata to chart0
# csvに変化があるとchart0リポジトリに反映
# make.ymlからのGitHub Actionsコミットではpushトリガーが発動しないため
# workflow_runで明示的にトリガーする
on:
  workflow_run:
    workflows: ["Daily make Update"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'data/pricedata/TOPIX (東証株価指数).csv'
      - 'data/pricedata/日経平均ボラティリティー・インデックス.csv'
      - 'data/pricedata/日経平均株価.csv'
      - 'data/pricedata/ドル円.csv'
      - 'data/pricedata/ビットコイン.csv'
      
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # workflow_runトリガーの場合は成功時のみ実行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout get
        uses: actions/checkout@v4

      - name: Clone chart0
        run: |
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/keroppa88/chart0.git chart0

      - name: Generate version file for cache busting
        run: |
          echo $(date +%s) > version.txt

      - name: Copy CSV files
        run: |
          cp -f version.txt chart0/data/version.txt
          cp -f "data/pricedata/TOPIX (東証株価指数).csv" chart0/data/000.csv
          cp -f "data/pricedata/日経平均株価.csv" chart0/data/001.csv
          cp -f "data/pricedata/日経平均ボラティリティー・インデックス.csv" chart0/data/002.csv
          cp -f "data/pricedata/ドル円.csv" chart0/data/081.csv
          cp -f "data/pricedata/ビットコイン.csv" chart0/data/082.csv

      - name: Commit & push if changed
        run: |
          cd chart0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add data/
            git commit -m "sync: pricedata from get [skip ci]"
            git push
          else
            echo "No changes; skip."
          fi
